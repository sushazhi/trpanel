<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebView 环境探针</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: calc(72px + env(safe-area-inset-top, 0px)) 14px 40px;
    background: #14161b; color: #e8eaf0;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  #env { color: #9aa3b2; margin-bottom: 14px; white-space: pre-wrap; word-break: break-all; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  td { border: 1px solid #2c313c; padding: 7px 10px; }
  td:first-child { color: #9aa3b2; width: 46%; }
  td:last-child { font-weight: 700; }
  .hi { color: #ffb454; } .bad { color: #ff7a7a; } .ok { color: #7ee787; }
  #verdict { border: 1px solid #2c313c; border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  /* 假顶栏：完全复刻应用顶部停靠栏的定位公式 top = 12px + safe-top */
  #mock-topbar {
    position: fixed; left: 0; right: 0; height: 40px;
    top: calc(12px + env(safe-area-inset-top, 0px));
    background: rgba(80,140,255,.85); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    border-radius: 0 0 10px 10px; z-index: 9;
  }
  /* env() 无法从 CSS 变量读回，靠这个隐藏元素的 resolved padding 取值 */
  #safe-probe {
    position: absolute; visibility: hidden; pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
</style>
</head>
<body>
<div id="mock-topbar">模拟应用顶栏（top = 12px + safe-top）</div>
<div id="safe-probe"></div>
<h1>WebView 环境探针</h1>
<div id="env"></div>
<table id="tbl"></table>
<div id="verdict"></div>
<script>
  const $ = (id) => document.getElementById(id)
  const ua = navigator.userAgent
  const isPhoneUA = /Android|iPhone|Mobile/i.test(ua)
  $('env').textContent = 'UA: ' + ua

  const sp = $('safe-probe')
  const cs = getComputedStyle(sp)
  const pad = (side) => parseFloat(cs['padding' + side]) || 0

  const vv = window.visualViewport
  const rows = [
    ['safe-area-inset-top', pad('Top'), true],
    ['safe-area-inset-bottom', pad('Bottom'), true],
    ['safe-area-inset-left', pad('Left'), true],
    ['safe-area-inset-right', pad('Right'), true],
    ['window.innerHeight', window.innerHeight],
    ['visualViewport.height', vv ? Math.round(vv.height) : null],
    ['visualViewport.offsetTop', vv ? Math.round(vv.offsetTop) : null],
    ['documentElement.clientHeight', document.documentElement.clientHeight],
    ['100vh 解析值', (() => { const d = document.createElement('div'); d.style.height = '100vh'; document.body.appendChild(d); const h = Math.round(d.getBoundingClientRect().height); d.remove(); return h })()],
    ['100dvh 解析值', (() => { const d = document.createElement('div'); d.style.height = '100dvh'; document.body.appendChild(d); const h = Math.round(d.getBoundingClientRect().height); d.remove(); return h })()],
    ['devicePixelRatio', window.devicePixelRatio],
    ['innerWidth', window.innerWidth],
  ]
  $('tbl').innerHTML = rows.map(([k, v, px]) => {
    const cls = k === 'safe-area-inset-top' && v > 0 ? 'hi' : ''
    return `<tr><td>${k}</td><td class="${cls}">${v}${px ? 'px' : ''}</td></tr>`
  }).join('')

  const safeTop = pad('Top')
  let verdict
  if (safeTop > 0) {
    verdict =
      `⚠️ safe-top = ${safeTop}px > 0\n` +
      'WebView 处于 edge-to-edge，env(safe-area-inset-top) 报告了状态栏高度。\n' +
      '应用的顶栏公式 12px + safe-top 会整体下移，顶部即出现等高空白。\n' +
      '→ 结论成立：需要在 fnOS 环境下忽略该值。'
  } else {
    verdict =
      `safe-top = 0，蓝色模拟顶栏应贴近视口顶部 12px 处。\n` +
      '若真机上它上方仍有大片空白，则空白另有原因（非 safe-area）。\n' +
      '请同时截图本页与顶栏实际位置。'
  }
  if (isPhoneUA) verdict = '📱 手机环境\n' + verdict
  $('verdict').textContent = verdict
</script>
</body>
</html>
