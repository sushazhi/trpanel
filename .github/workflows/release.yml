# 仅推送标签（v*）时构建发布：交叉编译 linux/amd64 + linux/arm64，
# 打包为带版本号的 tar.gz，附 sha256 校验和，上传到 GitHub Release。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 构建前端并嵌入后端
        run: |
          set -e
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          # go:embed 读取 backend/web/dist，把前端产物复制过去再编译
          rm -rf backend/web/dist
          mkdir -p backend/web/dist
          cp -r frontend/dist/. backend/web/dist/

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 交叉编译并打包
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p release
          for ARCH in amd64 arm64; do
            # 二进制统一命名，版本信息放进归档文件名
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" \
              go build -trimpath -ldflags "-s -w" -o ../release/trpanel ./cmd/server)
            tar -czf "release/trpanel-${TAG}-linux-${ARCH}.tar.gz" \
              -C release trpanel
            rm -f release/trpanel
          done
          cd release
          sha256sum trpanel-*.tar.gz > "checksums-${TAG}-sha256.txt"

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/trpanel-*.tar.gz
            release/checksums-*-sha256.txt
